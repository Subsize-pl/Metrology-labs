<text x="43.00" y="9.16" font-size="3.88" text-anchor="middle">Начало</text>
<text x="43.00" y="25.16" font-size="3.88" text-anchor="middle">data = parse(args)</text>
<text x="43.00" y="46.16" font-size="3.88" text-anchor="middle">data.length == 0?</text>
<text x="100.75" y="55.71" font-size="3.88" text-anchor="middle">Вывод:</text>
<text x="100.75" y="60.61" font-size="3.88" text-anchor="middle">«Нет корректных чисел»</text>
