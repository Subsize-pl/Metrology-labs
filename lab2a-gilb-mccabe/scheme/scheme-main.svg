<text x="43.00" y="67.16" font-size="3.88" text-anchor="middle">total = sum(data)</text>
<text x="43.00" y="83.21" font-size="3.88" text-anchor="middle">Вывод: «Сумма: », total,</text>
<text x="43.00" y="88.11" font-size="3.88" text-anchor="middle">«, максимум: », max(data)</text>
<text x="43.00" y="104.21" font-size="3.88" text-anchor="middle">Вывод: «Простых: », countPrimes(data),</text>
